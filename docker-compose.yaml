version: '3.8'

services:
  jwt-provider:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sereni-jwt-provider
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
    restart: unless-stopped